name: Public reference site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-reference-site
  cancel-in-progress: true

jobs:
  validate-site:
    name: Validate public product portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required portal files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/index.html \
            site/signal-ai.html \
            site/brokerage-infrastructure.html \
            site/axisoption.html \
            site/strategy-os.html \
            site/governance.html \
            site/technology.html \
            site/about.html \
            site/404.html \
            site/styles.css \
            site/app.js \
            site/assets/corex-mark.svg \
            site/robots.txt \
            site/sitemap.xml \
            site/.nojekyll; do
            test -e "$file"
          done

      - name: Validate internal links and document metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path('site')
          pages = sorted(root.glob('*.html'))
          errors = []

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.ids = []
                  self.title = ''
                  self.in_title = False
                  self.description = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a' and attrs.get('href'):
                      self.links.append(attrs['href'])
                  if attrs.get('id'):
                      self.ids.append(attrs['id'])
                  if tag == 'meta' and attrs.get('name') == 'description':
                      self.description = attrs.get('content', '').strip()
                  if tag == 'title':
                      self.in_title = True

              def handle_endtag(self, tag):
                  if tag == 'title':
                      self.in_title = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title += data

          for page in pages:
              parser = Parser()
              parser.feed(page.read_text(encoding='utf-8'))
              rel = page.relative_to(root)

              if not parser.title.strip():
                  errors.append(f'{rel}: missing <title>')
              if not parser.description:
                  errors.append(f'{rel}: missing meta description')
              if len(parser.ids) != len(set(parser.ids)):
                  errors.append(f'{rel}: duplicate id attribute')

              for href in parser.links:
                  parsed = urlparse(href)
                  if parsed.scheme or href.startswith('//') or href.startswith('mailto:') or href.startswith('tel:'):
                      continue
                  path = parsed.path
                  if not path or path == '/':
                      continue
                  target = (page.parent / path).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      errors.append(f'{rel}: local link escapes site root: {href}')
                      continue
                  if path.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      errors.append(f'{rel}: missing local target: {href}')

          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {len(pages)} HTML documents and local links.')
          PY

      - name: Validate indexing files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = 'https://corexcapitalai.github.io/CoreX-Capital-AI/'
          expected = {
              base,
              base + 'signal-ai.html',
              base + 'brokerage-infrastructure.html',
              base + 'axisoption.html',
              base + 'strategy-os.html',
              base + 'governance.html',
              base + 'technology.html',
              base + 'about.html',
          }

          tree = ET.parse('site/sitemap.xml')
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          found = {node.text.strip() for node in tree.findall('.//sm:loc', ns) if node.text}
          if found != expected:
              raise SystemExit(f'sitemap mismatch: expected={sorted(expected)} found={sorted(found)}')

          robots = Path('site/robots.txt').read_text(encoding='utf-8')
          expected_sitemap = 'Sitemap: ' + base + 'sitemap.xml'
          if 'User-agent: *' not in robots or 'Allow: /' not in robots or expected_sitemap not in robots:
              raise SystemExit('robots.txt does not expose the expected sitemap/indexing policy')

          print('Validated sitemap.xml and robots.txt.')
          PY

      - name: Smoke-test every public page
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory site > /tmp/corex-public-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /tmp/corex-index.html; then
              break
            fi
            sleep 0.25
          done

          grep -Fq '<title>CoreX Capital AI — Institutional AI & Financial Infrastructure</title>' /tmp/corex-index.html
          grep -Fq 'One financial technology ecosystem.' /tmp/corex-index.html

          declare -A checks=(
            [signal-ai.html]='CoreX Signal AI'
            [brokerage-infrastructure.html]='12 CORE MODULES'
            [axisoption.html]='AxisOption'
            [strategy-os.html]='Strategy OS'
            [governance.html]='Autonomous Veto Protocol'
            [technology.html]='STACK BY LAYER'
            [about.html]='THE MISSION'
            [404.html]='404 — PUBLIC PORTAL'
          )

          for page in "${!checks[@]}"; do
            output="/tmp/${page}.html"
            curl --fail --silent "http://127.0.0.1:8080/${page}" > "$output"
            test -s "$output"
            grep -Fq "${checks[$page]}" "$output"
          done

          curl --fail --silent http://127.0.0.1:8080/styles.css > /dev/null
          curl --fail --silent http://127.0.0.1:8080/app.js > /dev/null
          curl --fail --silent http://127.0.0.1:8080/assets/corex-mark.svg > /dev/null
          curl --fail --silent http://127.0.0.1:8080/robots.txt > /dev/null
          curl --fail --silent http://127.0.0.1:8080/sitemap.xml > /dev/null

  deploy-pages:
    name: Deploy GitHub Pages
    needs: validate-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
